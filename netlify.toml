# Netlify static site + serverless analytics
#
# Deploy credits: 每次 production deploy ≈ 15 credits（免费额度约 20 次/月）
# 仅当 commit message 含 [release] 或 [deploy] 时才构建 — 见 scripts/netlify-should-build.sh
# 发布请用 ./deploy.sh，不要每次改完就 push 指望自动上线
[build]
  command = "npm install && npm install --prefix netlify/functions"
  publish = "."
  functions = "netlify/functions"
  ignore = "bash scripts/netlify-should-build.sh"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

# 用户注册/登录/同步 — 服务端反代到 Vercel（大陆浏览器不直连 vercel.app）
[[redirects]]
  from = "/api/auth/*"
  to = "https://ielts-task1.vercel.app/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/feedback/*"
  to = "https://ielts-task1.vercel.app/api/feedback/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
