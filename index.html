<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅思作文教程（简化版）</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cover.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/page-transition.css">
  <link rel="stylesheet" href="css/user.css">
  <link rel="stylesheet" href="css/changelog.css">
</head>
<body>
  <div class="cover-page">
    <div class="cover-bg-quotes" id="cover-bg-quotes" aria-hidden="true"></div>
    <div class="cover-inner" data-s2t-scope>
      <div class="cover-badge" data-i18n="cover.badge">IELTS WRITING · 简化版教程</div>
      <h1 class="cover-title" data-i18n="cover.title">雅思作文教程</h1>
      <p class="cover-subtitle" data-i18n="cover.sub">本网站是雅思写作完整教程的简化版，涵盖小作文、大作文及更多模块。</p>

      <div class="cover-hub-stage" id="cover-hub-stage">
        <div class="cover-hub cover-hub-main" id="cover-hub-main">
          <button type="button" class="cover-hub-card" data-cover-expand="task1">
            <div class="cover-hub-head">
              <h3 data-i18n="cover.hub.task1">小作文</h3>
              <span class="module-tag live" data-i18n="cover.live">已开放</span>
            </div>
            <p class="cover-hub-desc" data-i18n="cover.hub.task1.desc">动态图 + 静态图 · 解题三步 · 语言技巧</p>
          </button>

          <button type="button" class="cover-hub-card" data-cover-expand="task2">
            <div class="cover-hub-head">
              <h3 data-i18n="cover.hub.task2">大作文</h3>
              <span class="module-tag live" data-i18n="cover.live">已开放</span>
            </div>
            <p class="cover-hub-desc" data-i18n="cover.hub.task2.desc">2.1 / 2.2 / 2.3 · 2.1.1 已开放</p>
          </button>

          <button type="button" class="cover-hub-card" data-cover-expand="handbook">
            <div class="cover-hub-head">
              <h3 data-i18n="cover.hub.handbook">必背宝典</h3>
              <span class="module-tag pending" data-i18n="cover.pending">待更新</span>
            </div>
            <p class="cover-hub-desc" data-i18n="cover.hub.handbook.desc">核心加分点 · 高频句式 · 易错提醒</p>
          </button>
        </div>

        <div class="cover-hub-sub" id="cover-hub-sub">
          <div class="cover-hub-sub-head">
            <button type="button" class="cover-hub-back" id="cover-hub-back" data-i18n="cover.back">返回</button>
            <h3 class="cover-hub-sub-title" id="cover-hub-sub-title"></h3>
          </div>
          <div class="cover-hub-sub-grid" id="cover-hub-sub-grid"></div>
        </div>
      </div>

      <p class="cover-signature"><span data-i18n="cover.signature">Proudly presented by</span> <em>037、</em></p>
      <p class="cover-notice" data-i18n="cover.notice">本网站及相关内容均为个人创作者原创，禁止随意转发。</p>

      <a class="cover-btn" href="home.html" id="cover-start" data-i18n="cover.start">开始学习</a>
    </div>
    <button type="button" class="changelog-btn" id="changelog-btn" data-i18n="changelog.btn">更新日志</button>
  </div>
  <script src="js/s2t-map.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/user.js"></script>
  <script src="js/user-ui.js"></script>
  <script src="js/cover-quotes.js"></script>
  <script src="js/changelog.js"></script>
  <script src="js/changelog-ui.js"></script>
  <script src="js/page-transition.js"></script>
  <script src="js/cover-hub.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("cover-start");
      const lastModule = (() => {
        try { return localStorage.getItem("ielts-last-module") || "home.html"; }
        catch { return "home.html"; }
      })();
      btn.href = lastModule;

      btn.addEventListener("click", (e) => {
        e.preventDefault();
        const go = () => CoverNav.go(lastModule);
        if (!UserStore.current()) UserUI.showOnboarding(go);
        else go();
      });
    });
  </script>
</body>
</html>
